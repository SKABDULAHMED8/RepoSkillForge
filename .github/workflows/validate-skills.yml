name: Validate skills

on:
  push:
  pull_request:

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README skill catalogue
        run: python scripts/update-readme.py

      - name: Commit README update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e

          if git diff --quiet -- README.md; then
            echo "README.md is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update skill catalogue"
          git push

      - name: Check README synchronization
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- README.md
          echo "README skill catalogue is synchronized."

  validate:
    runs-on: ubuntu-latest
    needs: generate-readme

    steps:
      - uses: actions/checkout@v4

      - name: Validate skill metadata
        shell: bash
        run: |
          set -e

          count=0

          while IFS= read -r -d '' file; do
            count=$((count+1))

            head -n 1 "$file" | grep -q '^---$'
            grep -q '^name:' "$file"
            grep -q '^description:' "$file"

            echo "OK: $file"
          done < <(find skills -name SKILL.md -print0)

          test "$count" -gt 0
          echo "Validated $count skill(s)."

      - name: Validate registry JSON
        run: python -m json.tool registry/skills.json >/dev/null

      - name: Validate README generator
        run: python scripts/update-readme.py

      - name: Check README is synchronized
        run: |
          git diff --exit-code -- README.md
          echo "README skill catalogue is synchronized with registry/skills.json."
